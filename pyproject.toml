[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "suno-adad-lab"
version = "0.1.0"
description = "Local reproducible audio analysis for ADAD TMiPvLE + RI"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12", "matplotlib>=3.7"]
[project.optional-dependencies]
ui = ["streamlit>=1.40,<2"]
test = ["pytest>=8"]
[project.scripts]
suno-lab = "suno_lab.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
